[package]
name = "XavierDB"
version = "1.0.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["json", "query", "macros"] }
base64 = "0.23.1"
bincode = { version = "2.0.1", features = ["serde"] }
bson = { version = "2", features = ["chrono-0_4"] }
crc32fast = "1.5.0"
dashmap = "6.2.1"
futures = "0.3.33"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
mongodb = "3.3.0"
notify = "8.2.0"
rand = { version = "0.8.5", features = ["std"] }
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }

# Integration battery in tests/ — black-box HTTP tests that need a running
# server + MongoDB (see AGENTS.md §4.1). Dev-deps do not affect release builds.
[dev-dependencies]
bson = { version = "2", features = ["chrono-0_4"] }
mongodb = "3.3.0"
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt"] }
ureq = { version = "2", features = ["json"] }

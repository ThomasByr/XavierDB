# Base compose file — config COMMON to all environments.
#
# NEVER used alone: compose is always invoked with an explicit overlay
# (xdb-compose.sh / deploy.sh do this for you):
#   docker compose -f compose.base.yaml -f compose.dev.yaml   # dev loop (cargo watch)
#   docker compose -f compose.base.yaml -f compose.pre.yaml   # pre-prod (default)
#   docker compose -f compose.base.yaml -f compose.prod.yaml  # prod (deploy.sh)
#
# The overlays own the per-environment deltas: resource limits + memswap,
# the MongoDB `command` (WiredTiger cache differs per env), the MongoDB DATA
# volume (named volume dev/pre, host bind mount prod), the dev cargo-watch
# loop, and TRUST_PROXY_HEADERS (prod only).
#
# Merge rules (`docker compose -f a -f b`): scalars/maps are overridden by
# the later file; volumes merge by CONTAINER target path (an overlay
# re-mounting /data/db replaces the base mount); ports concatenate (identical
# in every overlay here, so they live only in the base).
#
# End users deploying their own instance: do NOT use these files directly —
# copy compose.example.yaml to compose.yaml instead (it is standalone,
# documented, and gitignored so your copy stays local).

services:
  mongodb:
    restart: unless-stopped
    image: mongodb/mongodb-community-server:latest  # official MongoDB Community image
    container_name: MongoDB
    user: ":"
    environment:
      - TZ=Europe/Paris
    ports:
      - "127.0.0.1:27017:27017"                     # bind only to localhost
    volumes:
      # The DATA volume (/data/db) is per-environment: named volume in the
      # dev/pre overlays, host bind mount in prod. Configuration:
      - xavier_configdb:/data/configdb
    ulimits:
      nofile:
        soft: 65536                                 # raise soft limit
        hard: 1048576                               # raise hard limit
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          test -f /tmp/mongo_ready && exit 0 ||
          (mongosh --quiet --eval "db.adminCommand('ping').ok" &&
          touch /tmp/mongo_ready) ||
          exit 1
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 100

  xavierdb:
    restart: unless-stopped
    # No `image:` key on purpose: with both `build:` and `image:`, compose
    # tags the built image with that name — which would clobber the official
    # rust:1-slim-bookworm tag locally. The image is built FROM
    # rust:1-slim-bookworm (see Dockerfile); compose names it <project>-xavierdb.
    build: .
    container_name: XavierDB
    user: "$UID:$GID"                              # run as the host user, not root (UID/GID from .env)
    environment:
      - TZ=Europe/Paris
      # These OVERRIDE server.yml (precedence: env > server.yml > default):
      # the app reads its settings from server.yml, and OS env vars win. A
      # server.yml with host=127.0.0.1 / localhost mongo (bare-metal defaults)
      # must not reach a container: loopback is unreachable via the published
      # port and "localhost" is the API container itself. `.env` is only
      # UID/GID + prod resource tuning (compose interpolation) — the app
      # never reads it.
      - HOST=0.0.0.0                               # bind all interfaces inside the container
      - MONGODB_URI=mongodb://mongodb:27017        # mongo service name; default localhost won't work
      # TRUST_PROXY_HEADERS lives in compose.prod.yaml / compose.example.yaml
      # (reverse-proxy setups only).
    working_dir: /app
    volumes:
      - ".:/app"                                   # repo root = single source of truth: server.yml, config, config.bak, authorized_keys.yml
    ports:
      - "127.0.0.1:8000:8000"                      # forward the API on port 8000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # cheap local curl against the cached /health; the https fallback
      # keeps the check green when TLS is enabled in server.yml (with TLS the
      # plain-http listener does not exist at all)
      test:
        - "CMD-SHELL"
        - curl -fsS http://localhost:8000/health || curl -fksS https://localhost:8000/health
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  xavier_configdb:

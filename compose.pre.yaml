# Pre-prod overlay — prod-shaped stack (same prod image, no watch loop),
# smaller MongoDB footprint, named volume. Apply with:
#   docker compose -f compose.base.yaml -f compose.pre.yaml up -d --build
# (xdb-compose.sh DEFAULT: XDB_ENV=pre.)
#
# Resources (literals on purpose — pinned per environment, versioned in
# git; env-var tuning is a prod/example-only concern):
#   mongodb: 4g RAM + 1g swap, WiredTiger cache 2.0 (half the limit)
#   xavierdb: 0.5g RAM + 0.5g swap

services:
  mongodb:
    user: ":"
    deploy:
      resources:
        limits:
          memory: 4g                              # Docker enforces the cgroup memory limit
          cpus: "3.0"                             # full CPU cores
    memswap_limit: 5g                             # caps RAM+swap (4g RAM + 1g swap)
    command: >
      --wiredTigerCacheSizeGB 2.0
      --setParameter wiredTigerConcurrentReadTransactions=64
      --setParameter wiredTigerConcurrentWriteTransactions=64
    volumes:
      - xavier_mongo_db:/data/db                  # named volume (prod uses a host bind mount)

  xavierdb:
    deploy:
      resources:
        limits:
          memory: 0.5g
          cpus: "1.0"
    memswap_limit: 1g                             # 0.5g RAM + 0.5g swap

volumes:
  xavier_mongo_db:

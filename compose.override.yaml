# Dev override — picked up automatically by any `docker compose` invocation
# WITHOUT -f (i.e. NOT by deploy.sh, which passes -f compose.yaml).
#
# Dev loop: the API runs `cargo watch` INSIDE the container and recompiles
# from the bind-mounted repo. `--poll` is essential on Docker Desktop:
# VirtioFS delivers no inotify events (see .agents/skills/docker.md), and a
# native cargo-watch inside the container would never see host-side edits.
# The poll watcher stats mtimes through virtiofsd, which IS coherent — so
# host edits trigger rebuilds.
#
# First `docker compose up -d --build api` builds Dockerfile.dev (a few
# minutes: cargo install cargo-watch); the first in-container
# `cargo run --release` compiles the full dep tree into the target-cache
# volume once, later runs are incremental. The prod image (docker compose
# -f compose.yaml ...) is untouched: this override tags its own image.

services:
  api:
    develop:
      watch: []

    image: xavierdb-api-dev
    build:
      dockerfile: Dockerfile.dev

    volumes:
      - ".:/app"
      - cargo-cache:/cargo-home/registry
      - target-cache:/app/target

    environment:
      - CARGO_HOME=/cargo-home

    # Watch ONLY the code: the repo mount also holds runtime state files the
    # server rewrites itself (authorized_keys.yml on new-name logins, config,
    # logs) — watching those would rebuild+restart on every login.
    command: cargo watch --poll -w src -w Cargo.toml -x "run --release"

    healthcheck:
      interval: 5s
      timeout: 2s
      retries: 3

volumes:
  cargo-cache:
  target-cache:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XavierDB - Dashboard</title>
<link rel="icon" href="/dashboard/logo.png" type="image/png">
<link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
<!-- ===================== LOGIN VIEW ===================== -->
<div id="login-view" class="login-view hidden">
  <div class="login-card elevation-1">
    <div class="login-logo" aria-hidden="true">
      <img src="/dashboard/logo.png" alt="">
    </div>
    <h1 class="login-title">XavierDB</h1>
    <p class="login-subtitle">Admin dashboard</p>
    <div class="field">
      <label for="login-user">Username</label>
      <input id="login-user" type="text" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <button id="login-btn" class="btn btn-primary btn-block">Sign in</button>
    <p id="login-error" class="login-error"></p>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="app hidden">
  <header class="topbar elevation-0">
    <a class="topbar-brand" href="/dashboard">
      <img id="topbar-logo" src="/dashboard/logo.png" alt="">
      <span class="brand-name">XavierDB</span>
    </a>
    <div class="topbar-title"><span id="page-title" class="topbar-page"></span></div>
    <div class="topbar-actions">
      <div class="mongo-widget" title="MongoDB status">
        <button id="mongo-btn" class="mongo-status">
          <span id="mongo-dot" class="dot"></span>
          <span>MongoDB status</span>
        </button>
        <button id="mongo-refresh" class="mongo-refresh" title="Refresh MongoDB status">&#x21bb;</button>
      </div>
      <button id="theme-btn" class="topbar-toggle" title="Toggle theme">
        <span class="ic ic-sun" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="ic ic-moon" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span id="theme-label">Dark</span>
      </button>
      <button id="settings-btn" class="topbar-toggle" title="Dashboard settings">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span>Settings</span>
      </button>
      <button id="logout-btn" class="btn btn-text">Logout</button>
    </div>
  </header>

  <div class="body">
    <nav id="drawer" class="drawer elevation-1">
      <a href="#/overview"    data-route="overview"    class="nav-item">&#9632; Overview</a>
      <a href="#/clients"     data-route="clients"     class="nav-item">&#9673; Clients</a>
      <a href="#/config"      data-route="config"      class="nav-item">&#9881; Config</a>
      <a href="#/logs"        data-route="logs"        class="nav-item">&#9776; Logs</a>
      <div class="drawer-footer" id="drawer-footer"></div>
    </nav>

    <main id="view" class="view"></main>
  </div>
</div>

<div id="snackbar" class="snackbar"></div>
<div id="dialog" class="dialog-backdrop hidden"><div class="dialog elevation-3" id="dialog-box"></div></div>

<script src="/dashboard/app.js"></script>
</body>
</html>

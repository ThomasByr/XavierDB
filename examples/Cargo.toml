[package]
name = "xavierdb-examples"
version = "2.0.0"
edition = "2021"
description = "Runnable XavierDB client examples: setup (dashboard API) + showcase (client API) pairs"
publish = false

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# Run any example with:
#   cargo run --manifest-path examples/Cargo.toml --bin <name> -- [options]
# See examples/README.md for the full list and per-example launch commands.
